# Deletes branches whose commits are all already in the default branch.
# Runs after every merged pull request, or on demand from the Actions tab
# (tick "dry_run" to only list what would be deleted). Branches with an open
# pull request are always kept.
name: Delete merged branches

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List merged branches without deleting them"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: delete-merged-branches
  cancel-in-progress: false

jobs:
  delete:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete branches merged into the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          open_heads="$(gh pr list --state open --limit 500 --json headRefName --jq '.[].headRefName')"
          deleted=0
          while IFS= read -r branch; do
            [ "$branch" = "$DEFAULT_BRANCH" ] && continue
            if printf '%s\n' "$open_heads" | grep -Fxq -- "$branch"; then
              echo "keep   $branch (open pull request)"
            elif git merge-base --is-ancestor "origin/$branch" "origin/$DEFAULT_BRANCH"; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "would delete $branch"
              else
                git push origin --delete -- "$branch"
                echo "deleted $branch"
              fi
              deleted=$((deleted + 1))
            else
              echo "keep   $branch (has commits not in $DEFAULT_BRANCH)"
            fi
          done < <(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin | grep -vx HEAD)
          echo "$deleted merged branch(es) $([ "$DRY_RUN" = "true" ] && echo "found" || echo "deleted")"
