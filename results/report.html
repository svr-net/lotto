}

  --rule: #2c3036; --grid: #25292e;

body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body); }
.wrap { max-width: 960px; margin: 0 auto; padding-inline: 16px; padding-block: 40px 64px; display: grid; gap: 48px; }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 750; line-height: 1.05; }
h2 { font-size: 1.5rem; font-weight: 600; }
p { margin: 0; max-width: 65ch; color: var(--fg2); }
.eyebrow { font: 600 0.75rem/1 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
section { display: grid; gap: 16px; border-top: 1px solid var(--rule); padding-top: 24px; min-width: 0; }
header { display: grid; gap: 16px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 24px; font: 0.85rem var(--mono); color: var(--fg2); }
.facts b { color: var(--fg); font-weight: 600; }
.verdict { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 20px; display: grid; gap: 6px; }
.verdict strong { font-family: var(--display); font-size: 1.15rem; }
.balls { display: flex; flex-wrap: wrap; gap: 6px; }
.ball { width: 2.1rem; height: 2.1rem; border-radius: 50%; display: grid; place-items: center; font: 600 0.9rem var(--mono);
  background: var(--surface); border: 2px solid var(--fg2); font-variant-numeric: tabular-nums; }
.ball.bonus { border-style: dashed; color: var(--fg2); }
.ball.hit { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chart { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; overflow-x: auto; position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--fg2); font-family: var(--mono); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.85rem; color: var(--fg2); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font: 0.8rem/1.4 var(--mono); padding: 6px 8px; border-radius: 6px; white-space: nowrap; z-index: 2; }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font: 600 0.72rem var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
tr.ens td:first-child { font-weight: 600; }
tr.base-row td { color: var(--muted); }
.pill { font: 600 0.72rem var(--mono); padding: 2px 8px; border-radius: 99px; background: var(--grid); color: var(--fg2); }
.two { display: grid; gap: 16px; }
.two > * { min-width: 0; }
details summary { cursor: pointer; color: var(--fg2); font-weight: 600; }
details summary:focus-visible, button:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.note { font-size: 0.9rem; }
.picks5 { background: var(--surface); border: 2px solid var(--s2); border-radius: 12px; padding: 18px 20px; display: grid; gap: 12px; }
.picks5-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.picks5-head strong { font-family: var(--display); font-size: 1.2rem; }
.picks5-lines { display: grid; gap: 8px; }
.picks5-lines .line { display: flex; align-items: center; gap: 10px; }
.picks5-lines .ln { font: 600 0.8rem var(--mono); color: var(--muted); width: 1.2rem; }
.picks5-lines .tag { font: 0.75rem var(--mono); color: var(--muted); }
.ball.lead { border-color: var(--s2); }
.h3 { margin: 8px 0 0; font: 600 1.05rem/1.3 var(--body); }
td.good { color: var(--good); font-weight: 600; }
td.flag { font-weight: 600; }
nav.tabs { position: sticky; top: 0; z-index: 20; background: var(--bg); display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin;
  padding: 10px 0; margin: -24px 0 -24px; border-bottom: 1px solid var(--rule); -webkit-overflow-scrolling: touch; }
nav.tabs a { flex: none; font: 600 0.82rem var(--body); color: var(--fg2); text-decoration: none; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--rule); background: var(--surface); white-space: nowrap; }
nav.tabs a:hover { color: var(--fg); border-color: var(--muted); }
nav.tabs a[aria-current="page"] { color: var(--fg); border-color: var(--s2); box-shadow: inset 0 0 0 1px var(--s2); }
nav.tabs a:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.off { display: none !important; }
.muted { color: var(--muted); }
.ball.hit { background: var(--s2); border-color: var(--s2); color: var(--bg); font-weight: 700; }
.ball.bonus-hit { border-style: dashed; border-color: var(--s2); }
.live-draw { display: grid; gap: 8px; }
.live-draw .line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.live-draw .ln { font: 600 0.8rem var(--mono); color: var(--muted); width: 1.2rem; }
.live-draw .tag { font: 0.75rem var(--mono); color: var(--muted); white-space: nowrap; }
.live-draw .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-right: 12px; }

const $ = (s) => document.querySelector(s);
const A = D.assimilation, R = A.real, M = R.models, N = R.next;
const pc = (x, d = 2) => (x * 100).toFixed(d) + "%", sg = (x, d = 2) => (x >= 0 ? "+" : "") + x.toFixed(d);
const day = (s, o) => new Date(s + "T12:00:00Z").toLocaleDateString("en-GB", Object.assign({ timeZone: "UTC" }, o));
const gbp = (x) => (x < 0 ? "−" : "") + "£" + Math.abs(Math.round(x)).toLocaleString("en-GB");
$("#nd").textContent = day(N.night, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const ball = (n, cls = "") => `<span class="ball ${cls}">${n}</span>`;

// ---------- the wheel
(function () {
  $("#nd5").textContent = day(N.night, { weekday: "long", day: "numeric", month: "long" });
  const W = R.mixture_weights, lead = Object.entries(W).sort((a, b) => b[1] - a[1])[0];
  $("#wheel-sub").textContent = `${N.lines.length} lines · £${N.lines.length * 2} a draw`;
  $("#wheel-nums").innerHTML = `<div class="line"><span class="ln"></span><div class="balls">${N.numbers.map((n) => ball(n, "lead")).join("")}</div></div>`;
  $("#wheel-lede").textContent = `The 15 numbers the combined model (radix digits, a neural network and a particle filter, with fair, each weighted by how well it has predicted the real draws) finds most likely to hold 4 or more of the six, laid out as a "3 if 4" wheel: whenever 4 of the six drawn are among these 15, at least one line matches 3. Its own chance of 4+ is ${pc(N.forecast4)}, against ${pc(A.chance.rate4)} for any 15 numbers; the model now leans ${pc(lead[1], 0)} on ${lead[0]}. Over ${R.rounds.toLocaleString("en-GB")} past rounds its 15 held 4+ in ${pc(M.mixture.rate4)} of them (p ${M.mixture.p4.toFixed(2)} against chance): no better than any other 15 numbers so far.`;
  $("#wheel-sum").textContent = `The ${N.lines.length} lines`;
  $("#wheel-lines").innerHTML = N.lines.map((l, i) => `<div class="line"><span class="ln">${i + 1}</span><div class="balls">${l.map((n) => ball(n)).join("")}</div></div>`).join("");
  $("#wheel-links").innerHTML = `For the app: <a href="data/wheel_app.txt">wheel_app.txt</a> (one line per board) · <a href="data/wheel.csv">wheel.csv</a>`;
})();

// ---------- the wheel simulated on the viewer's device: a thin wrapper over sim/web.cpp (WebAssembly).
// Every calculation is in the kernel; this only moves bytes: inputs in, a compute pass the kernel describes, 7 floats
// per checkpoint out.
(function () {
  if (typeof WebAssembly === "undefined") { $("#sim").hidden = true; return; }
  const PATHS = 20000, q = new URLSearchParams(location.search).get("sim");
  let k, device;
  const bytes = (p, n) => new Uint8Array(k.memory.buffer, p, n);
  async function load() {
    if (k) return;
    const stub = () => 0;
    k = (await WebAssembly.instantiateStreaming(fetch("data/lotto_sim.wasm"), { wasi_snapshot_preview1: { fd_close: stub, fd_seek: stub, fd_write: stub } })).instance.exports;
    k._initialize();
    try {  // WebGPU only on a real GPU (a software adapter is slower than WebAssembly) unless ?sim=webgpu
      const a = q !== "cpu" && navigator.gpu && await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
      if (a && (!(a.isFallbackAdapter || (a.info && a.info.isFallbackAdapter)) || q === "webgpu")) device = await a.requestDevice();
    } catch (e) { device = null; }
  }
  async function gpu(desc) {  // one compute pass, exactly as the descriptor lays it out; binding 3 comes back
    const d = new Uint32Array(k.memory.buffer, desc, 16).slice(), U = GPUBufferUsage;
    const b = [0, 1, 2, 3].map((i) => { const [p, n, kind] = d.subarray(4 + 3 * i, 7 + 3 * i);
      const g = device.createBuffer({ size: n, usage: [U.UNIFORM, U.STORAGE, U.STORAGE | U.COPY_SRC][kind] | U.COPY_DST }); device.queue.writeBuffer(g, 0, bytes(p, n)); return g; });
    const read = device.createBuffer({ size: d[14], usage: U.MAP_READ | U.COPY_DST });
    const pipe = device.createComputePipeline({ layout: "auto", compute: { module: device.createShaderModule({ code: new TextDecoder().decode(bytes(d[0], d[1]).slice()) }), entryPoint: "main" } });
    const enc = device.createCommandEncoder(), pass = enc.beginComputePass();
    pass.setPipeline(pipe);
    pass.setBindGroup(0, device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: b.map((g, i) => ({ binding: i, resource: { buffer: g } })) }));
    pass.dispatchWorkgroups(d[2]);
    pass.end();
    enc.copyBufferToBuffer(b[3], 0, read, 0, d[14]);
    device.queue.submit([enc.finish()]);
    await read.mapAsync(GPUMapMode.READ);
    bytes(d[13], d[14]).set(new Uint8Array(read.getMappedRange()));
    read.unmap();
    [...b, read].forEach((g) => g.destroy());
  }
  function stage() {  // the wheel's lines as 64-bit masks, and the model's ball probabilities
    new Uint32Array(k.memory.buffer, k.lines_ptr(), N.lines.length * 2).set(N.lines.flatMap((l) => [0, 32].map((o) => l.reduce((m, x) => x > o && x <= o + 32 ? (m | (1 << (x - o - 1))) >>> 0 : m, 0))));
    new Float32Array(k.memory.buffer, k.weights_ptr(), 59).set(N.weights);
  }
  async function simulate(weighted, seed, cost) {  // the kernel's summary: 7 floats per checkpoint
    const n = N.lines.length;
    const out = device ? (await gpu(k.gpu_prepare(n, weighted, PATHS, seed)), k.gpu_finish(cost)) : k.run_cpu(n, weighted, PATHS, seed, cost);
    return new Float32Array(k.memory.buffer, out, 21).slice();
  }
  window.lottoSim = { load: async () => (await load(), stage(), { k, device }), gpu, simulate };  // for the tests
  $("#sim-run").addEventListener("click", async () => {
    const status = $("#sim-status");
    status.textContent = "Simulating…";
    try {
      await load(); stage();
      const cost = N.lines.length * 2, seed = (Math.random() * 4294967296) >>> 0, t0 = performance.now(), rows = [];
      for (const [name, weighted] of [["Fair", 0], ["As the model sees the machine", 1]]) {
        const o = await simulate(weighted, seed, cost);
        [26, 52, 104].forEach((n, c) => rows.push(`<tr><td>${c ? "" : name}</td><td>${n}</td><td>${o[c * 7 + 1].toFixed(0)} <span class="muted">(${o[c * 7].toFixed(0)} to ${o[c * 7 + 2].toFixed(0)})</span></td><td>${gbp(o[c * 7 + 4])} <span class="muted">(${gbp(o[c * 7 + 3])} to ${gbp(o[c * 7 + 5])})</span></td><td>${(o[c * 7 + 6] * 100).toFixed(0)}%</td></tr>`));
      }
      const ms = performance.now() - t0, rounds = 2 * PATHS * 104;
      $("#sim-table").innerHTML = `<thead><tr><th>Machine</th><th>Rounds ahead</th><th>Prize rounds</th><th>Net</th><th>No prize</th></tr></thead><tbody>${rows.join("")}</tbody>`;
      $("#sim-wrap").hidden = false;
      status.textContent = `${rounds.toLocaleString("en-GB")} simulated rounds in ${ms.toFixed(0)} ms on this device's ${device ? "GPU (WebGPU)" : "CPU (WebAssembly)"}. Median with the 90% range in brackets; net counts the fixed prizes only (2 matches a free Lucky Dip at £2, 3 matches £30, 4 £140, 5 £1,750). Each run draws fresh futures.`;
    } catch (e) { status.textContent = `Couldn't run the simulation here (${e.message}).`; }
  });
})();

// ---------- the backtest
(function () {
  const yr = new Date(R.first_night + "T12:00:00Z").getUTCFullYear(), F = R.filter, W = R.mixture_weights;
  $("#as-lede").textContent = `Before every real draw night since ${yr} (${R.nights.toLocaleString("en-GB")} nights, ${R.rounds.toLocaleString("en-GB")} rounds), four forecasts are made from the draws before it only, and every round that night then resets them to reality. A particle filter (${A.particles.toLocaleString("en-GB")} particles) treats the machine as hidden, learning how far each number could stray from fair and how fast that could drift, updated on the exact probability of the order the balls came out in. A family of ${A.networks} small neural networks adjusts its forecast per number from its uncertainty, the gaps, recent and first-ball counts and every number's digits in the first ten prime bases. ${A.radix_experts} radix strategies score each number by how its digits in those bases have been drawn. Fair, filter, networks and radix start with equal weight and are reweighted by every real draw. Each night thousands of simulated draws from each forecast choose its 15 numbers; the mixture's 15 are the wheel.`;
  const head = `<thead><tr><th>Forecast</th><th>Log score vs fair (nats)</th><th>p</th><th>Rounds with 4+ of 15</th><th>Rate</th><th>Its own forecast</th><th>p</th><th>3+ line</th><th>p</th></tr></thead>`;
  const row = (n, m) => `<tr class="${n === "fair" ? "base-row" : n === "mixture" ? "ens" : ""}"><td>${n === "fair" ? "Fair (any 15)" : n === "mixture" ? "Mixture: the wheel" : n}</td><td>${n === "fair" ? "–" : sg(m.log_lik_ratio)}</td><td>${n === "fair" ? "–" : m.p_better.toFixed(2)}</td><td>${m.hits4} <span class="muted">(${(m.rounds * A.chance.rate4).toFixed(1)})</span></td><td>${pc(m.rate4)}</td><td>${pc(m.forecast4)}</td><td class="${m.p4 < 0.01 ? "good" : ""}">${m.p4.toFixed(2)}</td><td>${pc(m.rate3, 1)} <span class="muted">(${pc(A.chance.rate3, 1)})</span></td><td class="${m.p3 < 0.01 ? "good" : ""}">${m.p3.toFixed(2)}</td></tr>`;
  $("#as-real").innerHTML = head + "<tbody>" + Object.entries(M).map(([n, m]) => row(n, m)).join("") + "</tbody>";
  $("#as-real-note").textContent = `Log score: the sum over the rounds of the log-probability each forecast gave the real set of six, minus fair's; p from flipping the signs of the per-round differences at random (one-sided). Rounds with 4+: expected by chance in brackets, p exact binomial against ${pc(A.chance.rate4)}. "Its own forecast": the model's stated chance of 4+ for its 15, on simulated draws it did not choose them from. 3+ line: a 3-match line on the 3-if-4 wheel, ${pc(A.chance.rate3, 1)} by chance.`;
  const bases = Object.entries(R.radix.bases).sort((a, b) => b[1] - a[1]), rules = Object.entries(R.radix.rules).sort((a, b) => b[1] - a[1]);
  const nbest = R.networks.slice().sort((a, b) => b.weight - a.weight)[0];
  $("#as-learn").textContent = `The filter settled on a bias of ${(F.tau[1] * 100).toFixed(2)}% per number (90% range ${(F.tau[0] * 100).toFixed(2)}% to ${(F.tau[2] * 100).toFixed(1)}%), the draws' evidence ${F.log_evidence_vs_fair >= 0 ? "for" : "against"} it ${Math.abs(F.log_evidence_vs_fair).toFixed(2)} nats against fair. The networks lean on learning rate ${nbest.lr} with penalty ${nbest.penalty} (${pc(nbest.weight, 0)}), and nudge the filter by ${(R.nudge_rms * 100).toFixed(2)}% on average. Among the radix strategies, base ${bases[0][0]} and "${rules[0][0]}" carry the most weight. The mixture weights below are the wheel's.`;
  $("#as-radix").innerHTML = `<thead><tr><th>Part of the mixture</th><th>Weight now</th></tr></thead><tbody>` + Object.entries(W).map(([n, w]) => `<tr><td>${n}</td><td>${pc(w, 1)}</td></tr>`).join("") +
    `<tr class="base-row"><td>Radix: by base</td><td>${bases.slice(0, 3).map(([b, w]) => `${b}: ${pc(w, 0)}`).join(" · ")}</td></tr><tr class="base-row"><td>Radix: by rule</td><td>${rules.slice(0, 2).map(([r, w]) => `${r}: ${pc(w, 0)}`).join(" · ")}</td></tr></tbody>`;
  const V = A.validation || [];
  const lock = V.find((v) => v.models.mixture.p4 < 0.01 && v.models.mixture.log_lik_ratio > 5);
  $("#as-val-lede").textContent = `The same pipeline on simulated histories as long as the real one, from a machine with six numbers made likelier by the stated amount. ` +
    (lock ? `From six numbers ${Math.round(lock.delta * 100)}% likelier it locks on: the mixture gains ${lock.models.mixture.log_lik_ratio.toFixed(0)} nats over fair and its 15 catch 4+ in ${pc(lock.models.mixture.rate4)} of rounds (knowing the planted numbers, the best 15 reach ${pc(lock.oracle_rate4)}). ` : "") +
    `Smaller biases stay hidden in this many rounds: even knowing them, the best 15 would barely beat chance. On the real draws the model behaves as it does on the fair simulated machine.`;
  $("#as-val").innerHTML = `<thead><tr><th>Simulated machine</th><th>Bias learned</th><th>Mixture vs fair (nats)</th><th>4+ of 15</th><th>Knowing the bias</th><th>3+ line</th><th>Weight on fair</th></tr></thead><tbody>` +
    V.map((v) => { const m = v.models.mixture; return `<tr><td>${v.delta ? `six numbers +${Math.round(v.delta * 100)}%` : "fair"}</td><td>${(v.filter.tau[1] * 100).toFixed(2)}%</td><td class="${m.log_lik_ratio > 5 ? "good" : ""}">${sg(m.log_lik_ratio, 1)}</td><td class="${m.p4 < 0.01 ? "good" : ""}">${pc(m.rate4)}</td><td>${pc(v.oracle_rate4)}</td><td>${pc(m.rate3, 1)}</td><td>${pc(v.mixture_weights.fair, 0)}</td></tr>`; }).join("") +
    `<tr class="base-row"><td>The real draws</td><td>${(F.tau[1] * 100).toFixed(2)}%</td><td>${sg(M.mixture.log_lik_ratio, 1)}</td><td>${pc(M.mixture.rate4)}</td><td>–</td><td>${pc(M.mixture.rate3, 1)}</td><td>${pc(W.fair, 0)}</td></tr></tbody>`;
  $("#as-note").textContent = `Only the particle count, the number of simulated draws and the network sizes are fixed; they set the computing budget, not the answer. Every weight, bias scale, drift, learning rate and penalty is learned from the draws.`;
})();

$("#method").textContent = `Data: the full UK Lotto history from lottery.merseyworld.com; only the ${A.rounds_total.toLocaleString("en-GB")} rounds since October 2015 are used, when the pool grew from 49 to 59 balls, up to ${day(A.last_draw, { day: "numeric", month: "long", year: "numeric" })}. Everything is computed in C++ (sim/assimilate.cpp, built on Alpine by sim/Dockerfile): the particle filter, the neural networks and their training, the radix strategies, the simulations and the tests; the page only displays the results, and its simulator runs the same C++ kernel as WebAssembly or WebGPU. Every line of six numbers has the same chance of winning. Nothing here changes that.`;

// ---------- menu: one tab of sections at a time, chosen by the URL hash
(function () {
  const nav = $("#tabs"), links = [...nav.querySelectorAll("a")];
  const parts = [...document.querySelectorAll("[data-tab]")];
  const tabs = links.map((a) => a.hash.slice(1));
  function show(scroll) {
    const t = tabs.includes(location.hash.slice(1)) ? location.hash.slice(1) : tabs[0];
    parts.forEach((el) => el.classList.toggle("off", el.dataset.tab !== t));
    links.forEach((a) => (a.hash.slice(1) === t ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
    if (scroll && window.scrollY > nav.offsetTop) window.scrollTo({ top: nav.offsetTop });
  }
  window.addEventListener("hashchange", () => show(true));
  show(false);
})();
</script>
